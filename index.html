<script>

  // window.storage shim — identical async API, backed by device localStorage.
  // Data lives on THIS device/browser and survives any app update.
  window.storage = {
    async get(key, shared) {
      const v = localStorage.getItem('gapp_' + key);
      return v === null ? null : { key, value: v, shared: !!shared };
    },
    async set(key, value, shared) {
      localStorage.setItem('gapp_' + key, value);
      return { key, value, shared: !!shared };
    },
    async delete(key) { localStorage.removeItem('gapp_' + key); return { key, deleted: true }; },
    async list(prefix, shared) {
      const keys = [];
      for (let i = 0; i < localStorage.length; i++) {
        const k = localStorage.key(i);
        if (k.startsWith('gapp_') && (!prefix || k.slice(5).startsWith(prefix))) keys.push(k.slice(5));
      }
      return { keys, prefix: prefix || null, shared: !!shared };
    },
  };

</script>

// Speak text using a specific German voice. Refuses to speak if no German voice
// is available — better silent than mispronounced by an English voice.
const speak = (text, voice, rate = 0.85) => {
  if (typeof window === 'undefined' || !('speechSynthesis' in window)) return false;
  if (!voice) return false;
  try {
    window.speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(text);
    u.voice = voice;
    u.lang = voice.lang;
    u.rate = rate;
    u.pitch = 1;
    window.speechSynthesis.speak(u);
    return true;
  } catch (e) { return false; }
};

const loadGermanVoices = () => {
  if (typeof window === 'undefined' || !('speechSynthesis' in window)) return [];
  return window.speechSynthesis.getVoices().filter(v => v.lang.toLowerCase().startsWith('de'));
};

// ============================================================
// STORAGE HELPERS — retry + safe merge
// ============================================================

// Mobile WebView storage is flaky; retry transient failures with backoff.
const storageRetry = async (fn, attempts = 3) => {
  let lastErr;
  for (let i = 0; i < attempts; i++) {
    try { return await fn(); } catch (e) {
      lastErr = e;
      await new Promise(r => setTimeout(r, 400 * (i + 1)));
    }
  }
  throw lastErr;
};

// Merge two progress objects, never losing data: take max strength per word,
// union mistakes, concat score histories.
const mergeProgressData = (a, b) => {
  const out = {
    learned: [],
    quizScores: [...(a.quizScores || []), ...(b.quizScores || [])],
    spellingScores: [...(a.spellingScores || []), ...(b.spellingScores || [])],
    mistakes: { ...(a.mistakes || {}) },
    strength: { ...(a.strength || {}) },
  };
  for (const [id, s] of Object.entries(b.strength || {})) {
    out.strength[id] = Math.max(out.strength[id] || 0, s);
  }
  for (const [id, m] of Object.entries(b.mistakes || {})) {
    if (!(id in out.mistakes)) out.mistakes[id] = m;
    else if (typeof m === 'number' && typeof out.mistakes[id] === 'number') {
      out.mistakes[id] = Math.max(out.mistakes[id], m);
    }
  }
  return out;
};

const progressIsEmpty = (p) =>
  Object.keys(p.strength || {}).length === 0 &&
  Object.keys(p.mistakes || {}).length === 0 &&
  (p.quizScores || []).length === 0 &&
  (p.spellingScores || []).length === 0;

function App() {
  const [progress, setProgress] = useState({ learned: [], quizScores: [], spellingScores: [], mistakes: {}, strength: {} });
  const [loaded, setLoaded] = useState(false);
  const loadFailedRef = useRef(false); // true = initial storage read errored (not merely empty)

  // Session state — persisted so each section remembers where you were
  const DEFAULT_SESSION = {
    view: 'home',
    fc: { category: 'All', index: 0, studied: [] },
    gr: { openId: 'les1', practiceState: {} },
    ph: { category: null, openKey: null },
    qz: { length: 20 },
  };
  const [session, setSession] = useState(DEFAULT_SESSION);

  // German voice state
  const [germanVoices, setGermanVoices] = useState([]);
  const [voicesReady, setVoicesReady] = useState(false);
  const [voiceName, setVoiceName] = useState(null);
  const [rate, setRate] = useState(0.85);

  // Load saved progress + voice preferences + session
  // shared:true means data persists across artifact versions under the same Claude account
  useEffect(() => {
    (async () => {
      // Load progress with retry. Track whether the read genuinely FAILED
      // (error) vs. simply found nothing (first visit) — this distinction
      // is critical: after a failed read we must never blind-overwrite.
      try {
        const r = await storageRetry(() => window.storage.get('german-progress'));
        if (r) {
          const p = JSON.parse(r.value);
          if (!p.strength) p.strength = {};
          if (Array.isArray(p.learned)) {
            for (const id of p.learned) {
              p.strength[id] = Math.max(p.strength[id] || 0, 3);
            }
          }
          setProgress({ learned: [], quizScores: [], spellingScores: [], mistakes: {}, strength: {}, ...p });
        }
        loadFailedRef.current = false;
      } catch (e) {
        // Read errored after retries — storage flaky. Saves will merge-first.
        console.error('Progress load failed:', e);
        loadFailedRef.current = true;
      }
      try {
        const r2 = await window.storage.get('german-voice-prefs');
        if (r2) {
          const p = JSON.parse(r2.value);
          if (p.voiceName) setVoiceName(p.voiceName);
          if (typeof p.rate === 'number') setRate(p.rate);
        }
      } catch (e) { /* no prefs yet */ }
      try {
        const r3 = await window.storage.get('german-session');
        if (r3) {
          const s = JSON.parse(r3.value);
          setSession(prev => ({
            ...prev,
            ...s,
            fc: { ...prev.fc, ...(s.fc || {}) },
            gr: { ...prev.gr, ...(s.gr || {}) },
            ph: { ...prev.ph, ...(s.ph || {}) },
            qz: { ...prev.qz, ...(s.qz || {}) },
          }));
        }
      } catch (e) { /* no session yet */ }
      setLoaded(true);
    })();
  }, []);

  // Persist session on every change (after first load)
  useEffect(() => {
    if (!loaded) return;
    storageRetry(() => window.storage.set('german-session', JSON.stringify(session))).catch(() => {});
  }, [session, loaded]);

  // Section-aware setters (each patch merges into that section)
  const sectionSet = (key) => (patch) =>
    setSession(s => ({ ...s, [key]: { ...s[key], ...patch } }));
  const fcSet = sectionSet('fc');
  const grSet = sectionSet('gr');
  const phSet = sectionSet('ph');
  const qzSet = sectionSet('qz');
  const setView = (v) => setSession(s => ({ ...s, view: v }));

  // Detect German voices (loads asynchronously on most browsers)
  useEffect(() => {
    if (typeof window === 'undefined' || !('speechSynthesis' in window)) {
      setVoicesReady(true);
      return;
    }
    const update = () => {
      setGermanVoices(loadGermanVoices());
      setVoicesReady(true);
    };
    update();
    window.speechSynthesis.addEventListener('voiceschanged', update);
    const t = setTimeout(update, 1200);
    return () => {
      window.speechSynthesis.removeEventListener('voiceschanged', update);
      clearTimeout(t);
    };
  }, []);

  // Pick the best default German voice once voices load
  useEffect(() => {
    if (germanVoices.length === 0) return;
    if (voiceName && germanVoices.some(v => v.name === voiceName)) return;
    const best =
      germanVoices.find(v => /Google Deutsch/i.test(v.name)) ||
      germanVoices.find(v => /Anna/i.test(v.name) && v.lang === 'de-DE') ||
      germanVoices.find(v => /Markus|Petra|Yannick/i.test(v.name)) ||
      germanVoices.find(v => v.lang === 'de-DE') ||
      germanVoices[0];
    if (best) setVoiceName(best.name);
  }, [germanVoices, voiceName]);

  // Persist voice preferences
  useEffect(() => {
    if (!voiceName) return;
    storageRetry(() => window.storage.set('german-voice-prefs', JSON.stringify({ voiceName, rate }))).catch(() => {});
  }, [voiceName, rate]);

  // Persist progress on every change, after initial load.
  // SAFETY RULES (fixes the record-wipe bug):
  //   1. Skip the first effect run after load — loading itself must never trigger a write.
  //   2. Never write an EMPTY progress object — an empty write can only destroy data.
  //   3. If the initial load FAILED (storage error), re-read and MERGE before writing,
  //      so a bad session can never overwrite the real record.
  //   4. Retry every read/write 3x — mobile WebView storage drops requests transiently.
  const [saveStatus, setSaveStatus] = useState('idle'); // 'idle' | 'saving' | 'saved' | 'failed'
  const saveStatusTimer = useRef(null);
  const firstSaveSkipped = useRef(false);
  useEffect(() => {
    if (!loaded) return;
    // Rule 1: the run triggered by load completing is not a user change — skip it.
    if (!firstSaveSkipped.current) { firstSaveSkipped.current = true; return; }
    // Rule 2: never overwrite storage with an empty object.
    if (progressIsEmpty(progress)) return;
    setSaveStatus('saving');
    let cancelled = false;
    (async () => {
      try {
        let toSave = progress;
        // Rule 3: load failed earlier → merge with whatever is in storage now.
        if (loadFailedRef.current) {
          try {
            const r = await storageRetry(() => window.storage.get('german-progress'));
            if (r) {
              const existing = JSON.parse(r.value);
              toSave = mergeProgressData(existing, progress);
              setProgress(toSave); // reflect merged state in the UI too
            }
            loadFailedRef.current = false;
          } catch (_) { /* still unreadable; write session data as-is */ }
        }
        await storageRetry(() => window.storage.set('german-progress', JSON.stringify(toSave)));
        if (cancelled) return;
        setSaveStatus('saved');
        if (saveStatusTimer.current) clearTimeout(saveStatusTimer.current);
        saveStatusTimer.current = setTimeout(() => setSaveStatus('idle'), 2200);
      } catch (err) {
        if (cancelled) return;
        console.error('Progress save failed:', err);
        setSaveStatus('failed');
      }
    })();
    return () => { cancelled = true; };
  }, [progress, loaded]);

  const saveProgress = (updater) => {
    setProgress(prev => typeof updater === 'function' ? updater(prev) : updater);
  };

  // A word is considered "really remembered" only after this many correct exposures
  // across flashcards / quiz / spelling / matching. Wrong answers reduce strength.
  const MASTERY_THRESHOLD = 3;

  const recordCorrect = (wordId) => {
    if (!wordId) return;
    saveProgress(prev => {
      const strength = { ...(prev.strength || {}) };
      strength[wordId] = Math.min((strength[wordId] || 0) + 1, MASTERY_THRESHOLD + 2);
      const mistakes = { ...(prev.mistakes || {}) };
      if (mistakes[wordId]) {
        if (mistakes[wordId].count > 1) mistakes[wordId] = { ...mistakes[wordId], count: mistakes[wordId].count - 1 };
        else delete mistakes[wordId];
      }
      let learned = prev.learned || [];
      if (strength[wordId] >= MASTERY_THRESHOLD && !learned.includes(wordId)) {
        learned = [...learned, wordId];
      }
      return { ...prev, strength, mistakes, learned };
    });
  };

  const recordWrong = (wordId, type) => {
    if (!wordId) return;
    saveProgress(prev => {
      const strength = { ...(prev.strength || {}) };
      strength[wordId] = Math.max((strength[wordId] || 0) - 1, 0);
      const mistakes = { ...(prev.mistakes || {}) };
      const existing = mistakes[wordId];
      mistakes[wordId] = {
        count: (existing?.count || 0) + 1,
        lastSeen: Date.now(),
        types: Array.from(new Set([...(existing?.types || []), type])),
      };
      let learned = prev.learned || [];
      if (strength[wordId] < MASTERY_THRESHOLD) {
        learned = learned.filter(id => id !== wordId);
      }
      return { ...prev, strength, mistakes, learned };
    });
  };

  // Backwards-compatible aliases used throughout the app
  const markLearned = (id) => recordCorrect(id);
  const recordMistake = (wordId, type) => recordWrong(wordId, type);
  const clearMistake = (wordId) => recordCorrect(wordId);

  const recordQuiz = (score, total) => {
    saveProgress(prev => ({
      ...prev,
      quizScores: [...(prev.quizScores || []), { score, total, date: Date.now() }].slice(-20),
    }));
  };

  const recordSpelling = (score, total) => {
    saveProgress(prev => ({
      ...prev,
      spellingScores: [...(prev.spellingScores || []), { score, total, date: Date.now() }].slice(-20),
    }));
  };

  const currentVoice = germanVoices.find(v => v.name === voiceName) || null;
  const speakWord = (text) => speak(text, currentVoice, rate);

  const voiceConfig = {
    voice: currentVoice,
    voices: germanVoices,
    voicesReady,
    rate,
    setVoiceName,
    setRate,
    speakWord,
  };

  const quizHelpers = { recordQuiz, recordSpelling, recordMistake, clearMistake };
  const [showReport, setShowReport] = useState(false);

  const view = session.view;

  return (
    <div className="min-h-screen w-full font-body" style={{ background: COLORS.bg, color: COLORS.ink }}>
      <FontStyles />
      <div className="grain min-h-screen">
        {!loaded ? (
          <div className="flex items-center justify-center min-h-screen">
            <div className="font-display text-2xl" style={{ color: COLORS.muted }}>...</div>
          </div>
        ) : (
          <>
            {view === 'home' && <Home setView={setView} progress={progress} saveStatus={saveStatus} saveProgress={saveProgress} />}
            {view === 'flashcards' && <Flashcards setView={setView} markLearned={markLearned} progress={progress} voiceConfig={voiceConfig} session={session.fc} setSession={fcSet} />}
            {view === 'grammar' && <Grammar setView={setView} session={session.gr} setSession={grSet} />}
            {view === 'phrases' && <Phrases setView={setView} voiceConfig={voiceConfig} session={session.ph} setSession={phSet} />}
            {view === 'quiz' && <Quiz setView={setView} progress={progress} voiceConfig={voiceConfig} session={session.qz} setSession={qzSet} {...quizHelpers} />}
            <ReportFab onClick={() => setShowReport(true)} />
            <ReportOverlay progress={progress} open={showReport} onClose={() => setShowReport(false)} />
          </>
        )}
      </div>
    </div>
  );
}

function generateReport(progress) {
  const now = new Date();
  const dateStr = now.toLocaleDateString('en-GB', { year: 'numeric', month: 'long', day: 'numeric' });
  const strength = progress.strength || {};
  const mistakes = progress.mistakes || {};
  const quizScores = progress.quizScores || [];
  const spellingScores = progress.spellingScores || [];

  const studiedIds = new Set([
    ...Object.entries(strength).filter(([, s]) => s >= 1).map(([id]) => id),
    ...Object.keys(mistakes),
  ]);

  const remembered = Object.values(strength).filter(s => s >= 3).length;
  const learning = Object.values(strength).filter(s => s >= 1 && s < 3).length;
  const review = Object.keys(mistakes).length;

  const byCat = {};
  VOCABULARY.forEach(v => {
    if (!byCat[v.cat]) byCat[v.cat] = { total: 0, studied: 0, remembered: 0 };
    byCat[v.cat].total++;
    if (studiedIds.has(v.id)) byCat[v.cat].studied++;
    if ((strength[v.id] || 0) >= 3) byCat[v.cat].remembered++;
  });
  const catLines = Object.entries(byCat)
    .filter(([, d]) => d.studied > 0)
    .sort(([, a], [, b]) => b.remembered - a.remembered || b.studied - a.studied)
    .map(([cat, d]) => `- **${cat}** — ${d.remembered} remembered, ${d.studied} studied (of ${d.total})`)
    .join('\n');

  const almost = Object.entries(strength)
    .filter(([, s]) => s === 2)
    .map(([id]) => VOCABULARY.find(v => v.id === id))
    .filter(Boolean);
  const almostLines = almost.map(w => `- ${w.de} — ${w.en}${w.cat ? ` _(${w.cat})_` : ''}`).join('\n');

  const reviewWords = Object.keys(mistakes)
    .map(id => ({ word: VOCABULARY.find(v => v.id === id), meta: mistakes[id] }))
    .filter(x => x.word)
    .sort((a, b) => (b.meta.count || 0) - (a.meta.count || 0));
  const reviewLines = reviewWords
    .map(({ word, meta }) => `- ${word.de} — ${word.en} _(missed ${meta.count || 1}×)_`)
    .join('\n');

  const recentQuiz = quizScores.slice(-5).reverse();
  const quizLines = recentQuiz.map(s => {
    const d = new Date(s.date).toLocaleDateString('en-GB');
    const pct = Math.round((s.score / s.total) * 100);
    return `- ${d}: ${s.score}/${s.total} (${pct}%)`;
  }).join('\n');

  const recentSpell = spellingScores.slice(-5).reverse();
  const spellLines = recentSpell.map(s => {
    const d = new Date(s.date).toLocaleDateString('en-GB');
    const pct = Math.round((s.score / s.total) * 100);
    return `- ${d}: ${s.score}/${s.total} (${pct}%)`;
  }).join('\n');

  // Full vocabulary listing — every word the user has interacted with, grouped by category.
  // This is the "combine my study" list they will paste into their notes.
  const totalByCat = {};
  VOCABULARY.forEach(v => { totalByCat[v.cat] = (totalByCat[v.cat] || 0) + 1; });

  const wordsByCat = {};
  VOCABULARY.forEach(v => {
    const s = strength[v.id] || 0;
    const m = mistakes[v.id];
    if (s === 0 && !m) return;
    if (!wordsByCat[v.cat]) wordsByCat[v.cat] = [];
    wordsByCat[v.cat].push({
      de: v.de,
      en: v.en,
      strength: s,
      missCount: m ? (m.count || 0) : 0,
    });
  });

  const statusLabel = (w) => {
    if (w.missCount > 0) return `to review · missed ${w.missCount}×`;
    if (w.strength >= 3) return 'remembered';
    if (w.strength === 2) return 'almost (2/3)';
    if (w.strength === 1) return 'learning (1/3)';
    return 'seen';
  };
  const rank = (w) => {
    // Sort inside each category: review first, then by strength descending
    if (w.missCount > 0) return -1;
    return 10 - w.strength; // 3 -> 7, 2 -> 8, 1 -> 9 (lower rank first)
  };
  const vocabSections = Object.entries(wordsByCat)
    .sort(([a], [b]) => a.localeCompare(b))
    .map(([cat, ws]) => {
      ws.sort((a, b) => rank(a) - rank(b) || a.de.localeCompare(b.de));
      const total = totalByCat[cat] || 0;
      const lines = ws.map(w => `- **${w.de}** — ${w.en} _(${statusLabel(w)})_`).join('\n');
      return `### ${cat} (${ws.length} of ${total})\n${lines}`;
    })
    .join('\n\n');

  const sections = [
    `# German Study Report`,
    `_Generated ${dateStr}_`,
    ``,
    `## Summary`,
    `- **Words remembered** (3× correct): ${remembered}`,
    `- **Still learning** (1–2× correct): ${learning}`,
    `- **To review** (mistake words): ${review}`,
    `- **Total studied**: ${studiedIds.size} of ${VOCABULARY.length}`,
    ``,
  ];
  if (catLines) sections.push(`## Progress by Category`, catLines, ``);
  if (vocabSections) sections.push(`## All Studied Vocabulary`, vocabSections, ``);
  if (almostLines) sections.push(`## Almost Mastered (need 1 more correct)`, almostLines, ``);
  if (reviewLines) sections.push(`## To Review`, reviewLines, ``);
  if (quizLines) sections.push(`## Recent Quiz Scores`, quizLines, ``);
  if (spellLines) sections.push(`## Recent Spelling Scores`, spellLines, ``);
  if (studiedIds.size === 0) {
    sections.push(`_No progress recorded yet. Start with Flashcards to begin building your vocabulary._`);
  }
  return sections.join('\n').trim() + '\n';
}

async function copyText(text, fallbackTextareaId) {
  try {
    await navigator.clipboard.writeText(text);
    return true;
  } catch (e) {
    if (fallbackTextareaId) {
      const ta = document.getElementById(fallbackTextareaId);
      if (ta) { ta.select(); document.execCommand && document.execCommand('copy'); }
    }
    return true;
  }
}

function downloadTextFile(text, filename, mime = 'text/plain') {
  try {
    const blob = new Blob([text], { type: mime });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = filename;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    setTimeout(() => URL.revokeObjectURL(url), 1000);
    return true;
  } catch (e) {
    return false;
  }
}

// Modal overlay shown when the FAB is tapped
function ReportOverlay({ progress, open, onClose }) {
  const [copied, setCopied] = useState(false);
  const [downloaded, setDownloaded] = useState(false);
  const text = useMemo(() => (open ? generateReport(progress) : ''), [progress, open]);

  if (!open) return null;
  const stamp = new Date().toISOString().slice(0, 10);

  const doCopy = async () => {
    await copyText(text, 'overlay-report-ta');
    setCopied(true);
    setTimeout(() => setCopied(false), 2200);
  };

  const doDownload = () => {
    const ok = downloadTextFile(text, `german-progress-${stamp}.md`, 'text/markdown');
    if (ok) {
      setDownloaded(true);
      setTimeout(() => setDownloaded(false), 2200);
    } else {
      doCopy();
    }
  };

  return (
    <div
      className="fixed inset-0 z-50 flex items-end sm:items-center justify-center p-3 sm:p-6"
      style={{ background: 'rgba(20,20,20,0.55)' }}

    >
      <div
        className="w-full max-w-lg rounded-2xl border overflow-hidden flex flex-col"
        style={{ background: COLORS.paper, borderColor: COLORS.line, maxHeight: '85vh' }}
        onClick={(e) => e.stopPropagation()}
      >
        <div className="flex items-center justify-between px-4 py-3 border-b" style={{ borderColor: COLORS.line }}>
          <div>
            <div className="text-xs tracking-wider uppercase" style={{ color: COLORS.muted }}>Study Report</div>
            <div className="text-sm" style={{ color: COLORS.ink, fontWeight: 500 }}>{stamp}</div>
          </div>
          <button
            onClick={onClose}
            aria-label="Close"
            className="w-8 h-8 rounded-full flex items-center justify-center hover:bg-black/5"
            style={{ color: COLORS.muted }}
          >
            <X size={18} />
          </button>
        </div>
        <div className="flex-1 overflow-auto p-3">
          <textarea
            id="overlay-report-ta"
            readOnly
            value={text}
            className="w-full text-xs p-3 rounded-lg border font-mono resize-none"
            style={{
              borderColor: COLORS.line,
              background: COLORS.paper,
              color: COLORS.ink,
              minHeight: '45vh',
            }}
            onClick={(e) => e.target.select()}
          />
        </div>
        <div className="grid grid-cols-2 gap-2 p-3 border-t" style={{ borderColor: COLORS.line }}>
          <button
            onClick={doCopy}
            className="px-3 py-2.5 text-sm rounded-lg transition-colors"
            style={{
              background: copied ? COLORS.forest : COLORS.ink,
              color: COLORS.paper,
            }}
          >
            {copied ? '✓ Copied' : 'Copy'}
          </button>
          <button
            onClick={doDownload}
            className="px-3 py-2.5 text-sm rounded-lg border transition-colors"
            style={{
              borderColor: downloaded ? COLORS.forest : COLORS.line,
              color: downloaded ? COLORS.forest : COLORS.ink,
              background: downloaded ? 'rgba(45,74,62,0.08)' : 'transparent',
            }}
          >
            {downloaded ? '✓ Downloaded' : 'Download .md'}
          </button>
        </div>
      </div>
    </div>
  );
}

function BackupSection({ progress, saveProgress }) {
  const [open, setOpen] = useState(false);
  const [mode, setMode] = useState(null); // 'export' | 'import' | 'report' | null
  const [exportText, setExportText] = useState('');
  const [importText, setImportText] = useState('');
  const [reportText, setReportText] = useState('');
  const [importStatus, setImportStatus] = useState(null); // {ok, msg}
  const [copied, setCopied] = useState(false);
  const [confirming, setConfirming] = useState(false);

  const stats = {
    remembered: Object.values(progress.strength || {}).filter(s => s >= 3).length,
    learning: Object.values(progress.strength || {}).filter(s => s >= 1 && s < 3).length,
    review: Object.keys(progress.mistakes || {}).length,
  };

  const handleExport = () => {
    const data = {
      version: 1,
      exportedAt: new Date().toISOString(),
      stats,
      progress: {
        strength: progress.strength || {},
        mistakes: progress.mistakes || {},
        quizScores: progress.quizScores || [],
        spellingScores: progress.spellingScores || [],
        learned: progress.learned || [],
      },
    };
    setExportText(JSON.stringify(data));
    setMode('export');
    setCopied(false);
  };

  const copyToClipboard = async (text, textareaId) => {
    await copyText(text, textareaId);
    setCopied(true);
    setTimeout(() => setCopied(false), 2500);
  };

  const downloadFile = (text, filename, mime = 'text/plain') => {
    const ok = downloadTextFile(text, filename, mime);
    if (!ok) copyToClipboard(text, 'report-textarea');
  };

  const handleReport = () => {
    setReportText(generateReport(progress));
    setMode('report');
    setCopied(false);
  };

  const parseImport = () => {
    try {
      const parsed = JSON.parse(importText);
      const p = parsed.progress || parsed;
      if (typeof p !== 'object' || p === null) throw new Error('Not an object');
      return {
        strength: (p.strength && typeof p.strength === 'object') ? p.strength : {},
        mistakes: (p.mistakes && typeof p.mistakes === 'object') ? p.mistakes : {},
        quizScores: Array.isArray(p.quizScores) ? p.quizScores : [],
        spellingScores: Array.isArray(p.spellingScores) ? p.spellingScores : [],
        learned: Array.isArray(p.learned) ? p.learned : [],
      };
    } catch (e) {
      return null;
    }
  };

  const handleImportPreview = () => {
    const restored = parseImport();
    if (!restored) {
      setImportStatus({ ok: false, msg: 'Invalid JSON — paste the exact text you exported earlier' });
      return;
    }
    setConfirming(true);
    setImportStatus(null);
  };

  const handleImportConfirm = () => {
    const restored = parseImport();
    if (!restored) return;
    saveProgress(restored);
    const remembered = Object.values(restored.strength).filter(s => s >= 3).length;
    const review = Object.keys(restored.mistakes).length;
    setImportStatus({ ok: true, msg: `Restored: ${remembered} remembered · ${review} review` });
    setImportText('');
    setConfirming(false);
    setTimeout(() => { setImportStatus(null); setMode(null); }, 3500);
  };

  return (
    <div className="mt-10 pt-6 border-t" style={{ borderColor: COLORS.line }}>
      <button
        onClick={() => { setOpen(!open); setMode(null); setImportStatus(null); setConfirming(false); }}
        className="text-xs uppercase tracking-wider font-semibold flex items-center gap-2"
        style={{ color: COLORS.muted }}
      >
        Backup &amp; Restore
        <ChevronRight size={12} style={{ transform: open ? 'rotate(90deg)' : 'none', transition: 'transform 0.2s' }} />
      </button>

      {open && (
        <div className="mt-4 space-y-3">
          <p className="text-xs leading-relaxed" style={{ color: COLORS.muted }}>
            App storage 通常跟住你個 account 保存，但如果切去新版本或新 chat，progress 可能 read 唔到。Export 一份 JSON 你自己留底就最穩陣。
          </p>

          <div className="grid grid-cols-3 gap-2">
            <button
              onClick={handleExport}
              className="px-2 py-2 text-sm rounded-lg border transition-colors"
              style={{
                borderColor: mode === 'export' ? COLORS.ink : COLORS.line,
                background: mode === 'export' ? COLORS.ink : 'transparent',
                color: mode === 'export' ? COLORS.paper : COLORS.ink,
              }}
            >
              Export
            </button>
            <button
              onClick={() => { setMode('import'); setImportStatus(null); setConfirming(false); }}
              className="px-2 py-2 text-sm rounded-lg border transition-colors"
              style={{
                borderColor: mode === 'import' ? COLORS.ink : COLORS.line,
                background: mode === 'import' ? COLORS.ink : 'transparent',
                color: mode === 'import' ? COLORS.paper : COLORS.ink,
              }}
            >
              Import
            </button>
            <button
              onClick={handleReport}
              className="px-2 py-2 text-sm rounded-lg border transition-colors"
              style={{
                borderColor: mode === 'report' ? COLORS.ink : COLORS.line,
                background: mode === 'report' ? COLORS.ink : 'transparent',
                color: mode === 'report' ? COLORS.paper : COLORS.ink,
              }}
            >
              Report
            </button>
          </div>

          {mode === 'export' && (
            <div className="space-y-2">
              <div className="text-xs" style={{ color: COLORS.muted }}>
                {stats.remembered} remembered · {stats.learning} learning · {stats.review} review
              </div>
              <textarea
                id="export-textarea"
                readOnly
                value={exportText}
                rows={5}
                className="w-full text-xs p-2 rounded-lg border font-mono"
                style={{ borderColor: COLORS.line, background: COLORS.paper, color: COLORS.ink, resize: 'vertical' }}
                onClick={(e) => e.target.select()}
              />
              <button
                onClick={() => copyToClipboard(exportText, 'export-textarea')}
                className="w-full px-3 py-2 text-sm rounded-lg transition-colors"
                style={{
                  background: copied ? COLORS.forest : COLORS.ink,
                  color: COLORS.paper,
                }}
              >
                {copied ? '✓ Copied — paste it somewhere safe' : 'Copy to clipboard'}
              </button>
            </div>
          )}

          {mode === 'import' && (
            <div className="space-y-2">
              <textarea
                value={importText}
                onChange={(e) => { setImportText(e.target.value); setImportStatus(null); setConfirming(false); }}
                placeholder="Paste your exported JSON here…"
                rows={5}
                className="w-full text-xs p-2 rounded-lg border font-mono"
                style={{ borderColor: COLORS.line, background: COLORS.paper, color: COLORS.ink, resize: 'vertical' }}
              />
              {!confirming ? (
                <button
                  onClick={handleImportPreview}
                  disabled={!importText.trim()}
                  className="w-full px-3 py-2 text-sm rounded-lg transition-opacity"
                  style={{
                    background: COLORS.ink,
                    color: COLORS.paper,
                    opacity: importText.trim() ? 1 : 0.4,

                <button
                  onClick={() => {
                    const stamp = new Date().toISOString().slice(0, 10);
                    downloadFile(reportText, `german-progress-${stamp}.md`, 'text/markdown');

                  style={{ borderColor: COLORS.line, color: COLORS.ink }}
                >

      )}
    </div>
  );
}

function Flashcards({ setView, markLearned, progress, voiceConfig, session, setSession }) {
  const { voice, voices, voicesReady, rate, setVoiceName, setRate, speakWord } = voiceConfig;
  const hasVoice = !!voice;

  const mistakeIds = useMemo(() => Object.keys(progress.mistakes || {}), [progress.mistakes]);
  const categories = useMemo(() => {
    const base = ['All', ...Array.from(new Set(VOCABULARY.map(v => v.cat)))];
    return mistakeIds.length > 0 ? [`Review (${mistakeIds.length})`, ...base] : base;
  }, [mistakeIds]);

  // Persisted across navigation
  const category = session.category || 'All';
  const index = session.index || 0;
  const sessionStudied = session.studied || [];
  const setCategory = (c) => setSession({ category: c, index: 0 });
  const setIndex = (i) => setSession({ index: i });
  const setSessionStudied = (s) => setSession({ studied: s });

  // Local UI state (not persisted)
  const [flipped, setFlipped] = useState(false);
  const [showMatching, setShowMatching] = useState(false);
  const [matchingPool, setMatchingPool] = useState([]);
  const [showSettings, setShowSettings] = useState(!voicesReady ? false : !hasVoice);

  const masteredIds = useMemo(() => {
    const threshold = 3;
    return new Set(Object.entries(progress.strength || {})
      .filter(([, s]) => s >= threshold)
      .map(([id]) => id));
  }, [progress.strength]);

  const deck = useMemo(() => {
    if (category.startsWith('Review')) return VOCABULARY.filter(v => mistakeIds.includes(v.id));
    const base = category === 'All' ? VOCABULARY : VOCABULARY.filter(v => v.cat === category);
    // Split: unstarted first, then in-progress (strength 1-2), mastered words hidden
    const unstarted = base.filter(v => !(progress.strength?.[v.id]) && !masteredIds.has(v.id));
    const inProgress = base.filter(v => (progress.strength?.[v.id] > 0) && !masteredIds.has(v.id));
    return [...inProgress, ...unstarted];
  }, [category, mistakeIds, masteredIds, progress.strength]);

  // Reset flipped only (index is preserved across nav now)
  useEffect(() => { setFlipped(false); }, [category]);

  const card = deck[index] || deck[0];

  const emptyReview = category.startsWith('Review') && deck.length === 0;

  // Auto-pronounce when card changes (only if a German voice is available)
  useEffect(() => {
    if (card && !showMatching && hasVoice && !emptyReview) {
      const t = setTimeout(() => speakWord(card.de), 200);
      return () => clearTimeout(t);
    }
  }, [card?.id, showMatching, hasVoice, emptyReview]);

  const isLearned = card && (progress.strength?.[card.id] || 0) >= 3;
  const wordsUntilGame = 10 - (sessionStudied.length % 10);
  const matchGameDue = sessionStudied.length > 0 && sessionStudied.length % 10 === 0;

  const buildMatchingPool = (studied) => {
    const recent10 = studied.slice(-10);
    const older = studied.slice(0, -10);
    let poolIds;
    if (older.length === 0) {
      // First matching game — use the 10 just-studied words (cap at 8 for screen comfort)
      poolIds = [...recent10].sort(() => Math.random() - 0.5).slice(0, 8);
    } else {
      // Subsequent games — mix 6 new + 3 review from older batches (spaced repetition)
      const recentSample = [...recent10].sort(() => Math.random() - 0.5).slice(0, 6);
      const reviewSample = [...older].sort(() => Math.random() - 0.5).slice(0, 3);
      poolIds = [...recentSample, ...reviewSample];
    }
    return poolIds.map(id => VOCABULARY.find(v => v.id === id)).filter(Boolean);
  };

  const advance = (knew) => {
    if (knew && card) markLearned(card.id);

    const wasNew = !sessionStudied.includes(card.id);
    const newSession = wasNew ? [...sessionStudied, card.id] : sessionStudied;
    if (wasNew) setSessionStudied(newSession);

    // Trigger matching game every 10 unique studied words
    if (wasNew && newSession.length > 0 && newSession.length % 10 === 0) {
      const pool = buildMatchingPool(newSession);
      if (pool.length >= 4) {
        try { window.speechSynthesis.cancel(); } catch {}
        setMatchingPool(pool);
        setShowMatching(true);
        return;
      }
    }

    setFlipped(false);
    // Stop at end of deck instead of looping
    if (index + 1 < deck.length) {
      setIndex(index + 1);
    } else {
      setIndex(deck.length); // signals "done"
    }
  };

  const handleMatchingComplete = () => {
    setShowMatching(false);
    setFlipped(false);
    if (index + 1 < deck.length) {
      setIndex(index + 1);
    } else {
      setIndex(deck.length); // signals "done"
    }
  };

  if (showMatching) {
    return (
      <MatchingGame
        words={matchingPool}
        onComplete={handleMatchingComplete}
        onExit={() => { setShowMatching(false); setView('home'); }}
        round={Math.floor(sessionStudied.length / 10)}
        voiceConfig={voiceConfig}
      />
    );
  }

  return (
    <div className="anim-slide max-w-2xl mx-auto px-5 pt-10 pb-16">
      <PageHeader setView={setView} eyebrow="Flashcards" title="Build your vocabulary" />

      {/* Category filter */}
      <div className="flex gap-2 overflow-x-auto pb-3 mb-4 -mx-5 px-5" style={{ scrollbarWidth: 'none' }}>
        {categories.map(c => (
          <button
            key={c}
            onClick={() => setCategory(c)}
            className="px-4 py-2 rounded-full text-sm whitespace-nowrap transition border"
            style={{
              background: category === c ? COLORS.ink : 'transparent',
              color: category === c ? COLORS.paper : COLORS.ink,
              borderColor: category === c ? COLORS.ink : COLORS.line,
            }}
          >
            {c}
          </button>
        ))}
      </div>

      {/* Voice chip / settings toggle */}
      <button
        onClick={() => setShowSettings(!showSettings)}
        className="flex items-center gap-2 px-3 py-2 rounded-full border text-xs mb-4 transition"
        style={{
          borderColor: hasVoice ? COLORS.line : COLORS.red,
          background: hasVoice ? COLORS.paper : '#FBEEEA',
        }}
      >
        <Volume2 size={13} style={{ color: hasVoice ? COLORS.forest : COLORS.red }} />
        <span style={{ color: COLORS.ink, fontWeight: 500 }}>
          {!voicesReady ? 'Loading voices…' :
           hasVoice ? `${voice.name} · ${rate <= 0.72 ? 'Slow' : rate >= 0.95 ? 'Fast' : 'Normal'}` :
           'No German voice — tap to fix'}
        </span>
        <ChevronRight size={12} style={{ color: COLORS.muted, transform: showSettings ? 'rotate(90deg)' : 'none', transition: 'transform 0.2s' }} />
      </button>

      {showSettings && (
        <VoiceSettings
          voices={voices}
          voicesReady={voicesReady}
          currentVoice={voice}
          rate={rate}
          onVoiceChange={setVoiceName}
          onRateChange={setRate}
          speakWord={speakWord}
        />
      )}

      {/* Progress + matching countdown */}
      {emptyReview ? (
        <div className="rounded-3xl p-8 border text-center anim-slide" style={{ background: COLORS.paper, borderColor: COLORS.line }}>
          <Check size={32} className="mx-auto mb-4" style={{ color: COLORS.forest }} />
          <div className="font-display text-2xl mb-2" style={{ fontWeight: 600 }}>Review queue is empty</div>
          <div className="text-sm mb-5" style={{ color: COLORS.muted }}>
            Nothing to review right now. Words you miss in the quiz or spelling round will appear here.
          </div>
          <button
            onClick={() => setCategory('All')}
            className="rounded-xl py-3 px-6 text-sm font-medium"
            style={{ background: COLORS.red, color: COLORS.paper }}
          >
            Study all words
          </button>
        </div>
      ) : index >= deck.length ? (
        <div className="rounded-3xl p-8 border text-center anim-slide" style={{ background: COLORS.paper, borderColor: COLORS.line }}>
          <Check size={32} className="mx-auto mb-4" style={{ color: COLORS.forest }} />
          <div className="font-display text-2xl mb-2" style={{ fontWeight: 600 }}>All done!</div>
          <div className="text-sm mb-5" style={{ color: COLORS.muted }}>
            You have been through all {deck.length} remaining cards.
            {masteredIds.size > 0 && ` ${masteredIds.size} mastered word${masteredIds.size > 1 ? 's' : ''} hidden.`}
          </div>
          <div className="flex flex-col gap-3">
            <button
              onClick={() => { setIndex(0); setSessionStudied([]); }}
              className="rounded-xl py-3 px-6 text-sm font-medium"
              style={{ background: COLORS.ink, color: COLORS.paper }}
            >
              Start over
            </button>
            <button
              onClick={() => setView('home')}
              className="rounded-xl py-3 px-6 text-sm font-medium border"
              style={{ borderColor: COLORS.line, color: COLORS.ink }}
            >
              Back to home
            </button>
          </div>
        </div>
      ) : (
      <>
      <div className="flex items-center justify-between mb-5 text-sm" style={{ color: COLORS.muted }}>
        <span>{index + 1} / {deck.length}{masteredIds.size > 0 && ` · ${masteredIds.size} mastered`}</span>
        <div className="flex items-center gap-1.5 text-xs">
          <Shuffle size={12} style={{ color: COLORS.red }} />
          <span style={{ color: COLORS.muted }}>

function MatchingGame({ words, onComplete, onExit, round, voiceConfig }) {
  const speakWord = voiceConfig?.speakWord || (() => false);
  const [germanCol, setGermanCol] = useState([]);
  const [englishCol, setEnglishCol] = useState([]);
  const [selectedGerman, setSelectedGerman] = useState(null);
  const [selectedEnglish, setSelectedEnglish] = useState(null);
  const [matched, setMatched] = useState([]);
  const [wrongPair, setWrongPair] = useState(null);
  const [busy, setBusy] = useState(false);
  const [done, setDone] = useState(false);

  useEffect(() => {
    setGermanCol([...words].sort(() => Math.random() - 0.5));
    setEnglishCol([...words].sort(() => Math.random() - 0.5));
  }, [words]);

  const tryMatch = (germanId, englishId) => {
    setBusy(true);
    if (germanId === englishId) {
      const newMatched = [...matched, germanId];
      const word = words.find(w => w.id === germanId);
      if (word) speakWord(word.de);
      setMatched(newMatched);
      setSelectedGerman(null);
      setSelectedEnglish(null);
      setBusy(false);
      if (newMatched.length === words.length) {
        setTimeout(() => setDone(true), 700);
      }
    } else {
      setWrongPair({ german: germanId, english: englishId });
      setTimeout(() => {
        setWrongPair(null);
        setSelectedGerman(null);
        setSelectedEnglish(null);
        setBusy(false);
      }, 600);
    }
  };

  const pickGerman = (id) => {
    if (busy || matched.includes(id)) return;
    if (selectedEnglish !== null) {
      tryMatch(id, selectedEnglish);
    } else {
      setSelectedGerman(id);
      const w = words.find(x => x.id === id);
      if (w) speakWord(w.de);
    }
  };

  const pickEnglish = (id) => {
    if (busy || matched.includes(id)) return;
    if (selectedGerman !== null) {
      tryMatch(selectedGerman, id);
    } else {
      setSelectedEnglish(id);
    }
  };

  if (done) {
    return (
      <div className="anim-slide max-w-2xl mx-auto px-5 pt-10 pb-16">
        <div
          className="rounded-3xl p-8 text-center border relative overflow-hidden"
          style={{ background: COLORS.paper, borderColor: COLORS.line }}
        >
          <div className="absolute -top-10 -left-10 w-40 h-40 rounded-full opacity-15" style={{ background: COLORS.red }} />
          <div className="absolute -bottom-10 -right-10 w-32 h-32 opacity-15" style={{ background: COLORS.gold }} />
          <div className="relative">
            <Sparkles size={32} className="mx-auto mb-4" style={{ color: COLORS.gold }} />
            <div className="font-display text-5xl mb-2" style={{ fontWeight: 600 }}>Wunderbar!</div>
            <div className="text-base mb-6" style={{ color: COLORS.muted }}>
              All {words.length} pairs matched. Back to your flashcards.
            </div>
            <button
              onClick={onComplete}
              className="rounded-xl py-3.5 px-7 text-sm font-medium transition active:scale-95"
              style={{ background: COLORS.red, color: COLORS.paper }}
            >
              Continue learning →
            </button>
          </div>
        </div>
      </div>
    );
  }

  const cellStyle = (id, side, selectedId) => {
    const isMatched = matched.includes(id);
    const isSel = selectedId === id;
    const isWrong = wrongPair && wrongPair[side] === id;
    return {
      background: isMatched ? COLORS.forest : isWrong ? COLORS.red : isSel ? COLORS.ink : COLORS.paper,
      color: (isMatched || isWrong || isSel) ? COLORS.paper : COLORS.ink,
      borderColor: isMatched ? COLORS.forest : isWrong ? COLORS.red : isSel ? COLORS.ink : COLORS.line,
      opacity: isMatched ? 0.55 : 1,
    };
  };

  return (
    <div className="anim-slide max-w-2xl mx-auto px-5 pt-10 pb-16">
      <div className="mb-6">
        <button
          onClick={onExit}
          className="flex items-center gap-1.5 text-sm mb-5 hover:opacity-70 transition"
          style={{ color: COLORS.muted }}
        >
          <ArrowLeft size={16} /> Back to home
        </button>
        <div className="flex items-center gap-2 mb-2" style={{ color: COLORS.red }}>
          <div className="h-[2px] w-6" style={{ background: COLORS.red }} />
          <span className="text-xs tracking-[0.2em] uppercase font-medium">
            Matching Game · Round {round || 1}
          </span>
        </div>
        <h2 className="font-display text-4xl tracking-tight mb-2" style={{ fontWeight: 500 }}>
          Pair them up
        </h2>
        <p className="text-sm leading-relaxed" style={{ color: COLORS.muted }}>
          Tap a German word, then tap its English meaning. Older words come back here so you do not forget them.
        </p>
      </div>

      <div className="flex items-center gap-3 mb-5 text-sm" style={{ color: COLORS.muted }}>
        <span>Matched: <span style={{ color: COLORS.ink, fontWeight: 600 }}>{matched.length}/{words.length}</span></span>
        <div className="flex-1 h-[2px]" style={{ background: COLORS.line }}>
          <div className="h-full transition-all duration-500" style={{ width: `${(matched.length / words.length) * 100}%`, background: COLORS.forest }} />
        </div>
      </div>

      <div className="grid grid-cols-2 gap-2.5">
        {/* German column */}
        <div className="space-y-2">
          <div className="text-xs tracking-wider uppercase mb-1 px-1" style={{ color: COLORS.red }}>Deutsch</div>
          {germanCol.map(w => (
            <button
              key={w.id}
              onClick={() => pickGerman(w.id)}
              disabled={matched.includes(w.id)}
              className={`w-full rounded-xl px-3 py-3 border text-center transition-all font-display ${wrongPair && wrongPair.german === w.id ? 'anim-shake' : ''}`}
              style={{ ...cellStyle(w.id, 'german', selectedGerman), fontSize: '15px', fontWeight: 500 }}
            >
              {w.de}
            </button>
          ))}
        </div>

        {/* English column */}
        <div className="space-y-2">
          <div className="text-xs tracking-wider uppercase mb-1 px-1" style={{ color: COLORS.navy }}>English</div>
          {englishCol.map(w => (
            <button
              key={w.id}
              onClick={() => pickEnglish(w.id)}
              disabled={matched.includes(w.id)}
              className={`w-full rounded-xl px-3 py-3 border text-center transition-all ${wrongPair && wrongPair.english === w.id ? 'anim-shake' : ''}`}
              style={{ ...cellStyle(w.id, 'english', selectedEnglish), fontSize: '14px' }}
            >
              {w.en}
            </button>
          ))}
        </div>
      </div>
    </div>
  );
}

function LessonPractice({ practice, lessonId, passedRound, onPass }) {
  const [started, setStarted] = useState(false);
  const [shuffled, setShuffled] = useState([]);
  const [current, setCurrent] = useState(0);
  const [score, setScore] = useState(0);
  const [selected, setSelected] = useState(null);
  const [done, setDone] = useState(false);

  const begin = () => {
    setShuffled([...practice].sort(() => Math.random() - 0.5));
    setCurrent(0); setScore(0); setSelected(null); setDone(false);
    setStarted(true);
  };

  const choose = (opt) => {
    if (selected) return;
    setSelected(opt);
    const q = shuffled[current];
    const correct = opt === q.a;
    if (correct) setScore(s => s + 1);
    setTimeout(() => {
      if (current + 1 >= shuffled.length) {
        const finalScore = correct ? score + 1 : score;
        if (finalScore === shuffled.length) onPass();
        setDone(true);
      } else {
        setCurrent(current + 1);
        setSelected(null);
      }
    }, 850);
  };

  if (!started) {
    return (
      <button
        onClick={begin}
        className="mt-5 w-full rounded-xl py-3.5 text-sm font-medium transition active:scale-95 flex items-center justify-center gap-2"
        style={{ background: COLORS.red, color: COLORS.paper }}
      >
        <Brain size={16} />
        {passedRound ? 'Practise again' : `Try ${practice.length} quick questions`}
      </button>
    );
  }

  if (done) {
    const allCorrect = score === shuffled.length;
    return (
      <div className="mt-5 rounded-xl p-5 text-center border" style={{ background: COLORS.bg, borderColor: COLORS.line }}>
        <div className="font-display text-3xl mb-1" style={{ fontWeight: 600, color: allCorrect ? COLORS.forest : COLORS.ink }}>
          {score}<span style={{ color: COLORS.muted }}>/{shuffled.length}</span>
        </div>
        <div className="text-sm mb-4" style={{ color: COLORS.muted }}>
          {allCorrect ? 'Excellent — this lesson is in your head.' : 'Read the lesson again, then try once more.'}
        </div>
        <button
          onClick={begin}
          className="rounded-xl py-2.5 px-5 text-sm font-medium border"
          style={{ borderColor: COLORS.line, background: COLORS.paper }}
        >
          Try again
        </button>
      </div>
    );
  }

  const q = shuffled[current];
  return (
    <div className="mt-5 anim-slide">
      <div className="flex items-center gap-2 mb-3 text-xs" style={{ color: COLORS.muted }}>
        <span>Practice · {current + 1} / {shuffled.length}</span>
        <div className="flex-1 h-[2px]" style={{ background: COLORS.line }}>
          <div className="h-full transition-all" style={{ width: `${(current / shuffled.length) * 100}%`, background: COLORS.red }} />
        </div>
      </div>
      <div className="rounded-xl p-4 mb-3 border text-center" style={{ background: COLORS.bg, borderColor: COLORS.line }}>
        <div className="font-display text-xl" style={{ fontWeight: 500 }}>{q.q}</div>
      </div>
      <div className="grid grid-cols-1 gap-2">
        {q.options.map(opt => {
          const isSel = selected === opt;
          const isCorrect = selected && opt === q.a;
          const isWrong = isSel && opt !== q.a;
          return (
            <button
              key={opt}
              onClick={() => choose(opt)}
              disabled={!!selected}
              className="rounded-xl p-3 text-left border transition flex items-center justify-between font-display"
              style={{
                background: isCorrect ? COLORS.forest : isWrong ? COLORS.red : COLORS.paper,
                color: (isCorrect || isWrong) ? COLORS.paper : COLORS.ink,
                borderColor: isCorrect ? COLORS.forest : isWrong ? COLORS.red : COLORS.line,
                fontSize: '15px',
                fontWeight: 500,
              }}
            >
              <span>{opt}</span>
              {isCorrect && <Check size={16} />}
              {isWrong && <X size={16} />}
            </button>
          );
        })}
      </div>
      {selected && shuffled[current].why && (
        <div className="mt-2 text-xs italic" style={{ color: COLORS.muted }}>
          {shuffled[current].why}
        </div>
      )}
    </div>
  );
}

// Normalise German input for forgiving comparison (umlaut spellings, case, spacing)
const normalizeDe = (s) => (s || '')
  .toLowerCase().trim()
  .replace(/ä/g, 'ae').replace(/ö/g, 'oe').replace(/ü/g, 'ue').replace(/ß/g, 'ss')
  .replace(/\s+/g, ' ');
const stripArticle = (s) => s.replace(/^(der|die|das|ein|eine|einen)\s+/i, '');
const checkSpelling = (input, target) => {
  const ni = normalizeDe(input);
  if (!ni) return false;
  return ni === normalizeDe(target) || ni === normalizeDe(stripArticle(target));
};

function Quiz({ setView, progress, voiceConfig, session, setSession, recordQuiz, recordSpelling, recordMistake, clearMistake }) {
  const speakWord = voiceConfig?.speakWord || (() => false);
  const hasVoice = !!voiceConfig?.voice;
  const length = session.length || 20;
  const setLength = (n) => setSession({ length: n });

  const [phase, setPhase] = useState('setup'); // setup | mc | mcResult | spelling | spellingResult

  // Multiple-choice state
  const [questions, setQuestions] = useState([]);
  const [current, setCurrent] = useState(0);
  const [score, setScore] = useState(0);
  const [selected, setSelected] = useState(null);
  const [mcWrongIds, setMcWrongIds] = useState([]);

  // Spelling state
  const [spellWords, setSpellWords] = useState([]);
  const [spellIndex, setSpellIndex] = useState(0);
  const [spellScore, setSpellScore] = useState(0);
  const [spellInput, setSpellInput] = useState('');
  const [spellResult, setSpellResult] = useState(null);

  // The pool of words the user has actually studied — quiz picks from here only,
  // so we never test a word they've never seen before.
  const studiedPool = useMemo(() => {
    const strength = progress.strength || {};
    const mistakes = progress.mistakes || {};
    const ids = new Set([
      ...Object.entries(strength).filter(([, s]) => s >= 1).map(([id]) => id),
      ...Object.keys(mistakes),
    ]);
    return VOCABULARY.filter(v => ids.has(v.id));
  }, [progress.strength, progress.mistakes]);

  const buildMC = (n) => {
    const mistakeIds = Object.keys(progress.mistakes || {});
    const mistakeWords = studiedPool.filter(v => mistakeIds.includes(v.id)).sort(() => Math.random() - 0.5);
    const others = studiedPool.filter(v => !mistakeIds.includes(v.id)).sort(() => Math.random() - 0.5);
    const picked = [...mistakeWords, ...others].slice(0, Math.min(n, studiedPool.length));
    return picked.map(item => {
      // Distractors can come from the full vocabulary so wrong options stay varied
      const wrong = VOCABULARY.filter(p => p.id !== item.id && p.en !== item.en)
        .sort(() => Math.random() - 0.5).slice(0, 3);
      const options = [item, ...wrong].sort(() => Math.random() - 0.5);
      return { id: item.id, prompt: item.de, answer: item.en, options: options.map(o => o.en) };
    });
  };

  const startMC = () => {
    setQuestions(buildMC(length));
    setCurrent(0); setScore(0); setSelected(null); setMcWrongIds([]);
    setPhase('mc');
  };

  const q = questions[current];

  // ---- MC handlers ----
  const choose = (opt) => {
    if (selected) return;
    setSelected(opt);
    const correct = opt === q.answer;
    if (correct) {
      setScore(s => s + 1);
      clearMistake(q.id);
      if (hasVoice) speakWord(q.prompt);
    } else {
      recordMistake(q.id, 'quiz');
      setMcWrongIds(ids => [...ids, q.id]);
    }
    setTimeout(() => {
      if (current + 1 >= questions.length) {
        recordQuiz(correct ? score + 1 : score, questions.length);
        setPhase('mcResult');
      } else {
        setCurrent(current + 1);
        setSelected(null);
      }
    }, 850);
  };

  const restartAll = () => {
    setQuestions([]);
    setCurrent(0); setScore(0); setSelected(null); setMcWrongIds([]);
    setSpellWords([]); setSpellIndex(0); setSpellScore(0); setSpellInput(''); setSpellResult(null);
    setPhase('setup');
  };

  // ---- Spelling setup ----
  const startSpelling = () => {
    // Spell the quizzed words, putting the ones missed in MC first
    const wrongFirst = questions.filter(x => mcWrongIds.includes(x.id));
    const rest = questions.filter(x => !mcWrongIds.includes(x.id));
    const ordered = [...wrongFirst, ...rest].map(x => VOCABULARY.find(v => v.id === x.id)).filter(Boolean);
    setSpellWords(ordered);
    setSpellIndex(0); setSpellScore(0); setSpellInput(''); setSpellResult(null);
    setPhase('spelling');
  };

  const submitSpelling = () => {
    if (spellResult) return;
    const word = spellWords[spellIndex];
    const correct = checkSpelling(spellInput, word.de);
    setSpellResult(correct ? 'correct' : 'wrong');
    if (correct) {
      setSpellScore(s => s + 1);
      clearMistake(word.id);
      if (hasVoice) speakWord(word.de);
    } else {
      recordMistake(word.id, 'spelling');
    }
  };

  const nextSpelling = () => {
    if (spellIndex + 1 >= spellWords.length) {
      recordSpelling(spellScore, spellWords.length);
      setPhase('spellingResult');
    } else {
      setSpellIndex(spellIndex + 1);
      setSpellInput('');
      setSpellResult(null);
    }
  };

  // ============ SETUP ============
  if (phase === 'setup') {
    const available = studiedPool.length;

    if (available === 0) {
      return (
        <div className="anim-slide max-w-2xl mx-auto px-5 pt-10 pb-16">
          <PageHeader setView={setView} eyebrow="Quiz" title="Study a few words first" />
          <div className="rounded-2xl p-6 border" style={{ background: COLORS.paper, borderColor: COLORS.line }}>
            <p className="text-sm leading-relaxed mb-4" style={{ color: COLORS.ink }}>
              Quiz 只會測你 study 過嘅字，唔會考未見過嘅生字。你未 study 過任何字，開返 Flashcards 過幾張先啦。
            </p>
            <button
              onClick={() => setView('flashcards')}
              className="w-full rounded-xl py-3 text-sm font-medium"
              style={{ background: COLORS.red, color: COLORS.paper }}
            >
              Go to Flashcards →
            </button>
          </div>
        </div>
      );
    }

    const lengthOptions = [
      { val: 10, label: 'Short', desc: '~3 min' },
      { val: 20, label: 'Medium', desc: '~5 min' },
      { val: 30, label: 'Long', desc: '~8 min' },
      { val: 50, label: 'Marathon', desc: '~15 min' },
    ];
    return (
      <div className="anim-slide max-w-2xl mx-auto px-5 pt-10 pb-16">
        <PageHeader setView={setView} eyebrow="Quiz" title="How long today?" />
        <div className="mb-6 rounded-xl px-4 py-3 border flex items-center gap-2" style={{ background: COLORS.paper, borderColor: COLORS.line }}>
          <div className="w-2 h-2 rounded-full" style={{ background: COLORS.forest }} />
          <p className="text-sm" style={{ color: COLORS.ink }}>
            Testing from <span style={{ fontWeight: 600 }}>{available}</span> studied {available === 1 ? 'word' : 'words'}
          </p>
        </div>
        <p className="text-sm leading-relaxed mb-6" style={{ color: COLORS.muted }}>
          Words you have missed before will be slipped in first, so you keep meeting them until they stick.
        </p>
        <div className="space-y-3 mb-6">
          {lengthOptions.map(opt => {
            const active = length === opt.val;
            const capped = opt.val > available;
            const actualN = Math.min(opt.val, available);
            return (
              <button
                key={opt.val}
                onClick={() => setLength(opt.val)}
                className="w-full text-left rounded-2xl p-4 border transition flex items-center gap-4"
                style={{
                  background: active ? COLORS.ink : COLORS.paper,
                  color: active ? COLORS.paper : COLORS.ink,
                  borderColor: active ? COLORS.ink : COLORS.line,
                }}
              >
                <div
                  className="w-6 h-6 rounded-full border-2 shrink-0 flex items-center justify-center"
                  style={{ borderColor: active ? COLORS.paper : COLORS.line }}
                >
                  {active && <div className="w-2.5 h-2.5 rounded-full" style={{ background: COLORS.paper }} />}
                </div>
                <div className="flex-1">
                  <div className="font-display text-lg" style={{ fontWeight: 600 }}>{opt.label}</div>
                  <div className="text-sm opacity-75">
                    {capped ? `${actualN} questions (all studied so far) · ${opt.desc}` : `${opt.val} questions · ${opt.desc}`}
                  </div>
                </div>
              </button>
            );
          })}
        </div>
        <button
          onClick={startMC}
          className="w-full rounded-xl py-4 text-sm font-medium transition active:scale-95"
          style={{ background: COLORS.red, color: COLORS.paper }}
        >
          Start quiz →
        </button>
      </div>
    );
  }

  if (phase !== 'setup' && questions.length === 0 && phase === 'mc') return null;

  // ============ MC RESULT ============
  if (phase === 'mcResult') {
    const pct = Math.round((score / questions.length) * 100);
    const msg = pct >= 80 ? 'Wunderbar! A strong result.' : pct >= 50 ? 'Gut gemacht. Keep going.' : 'A good start — keep practising.';
    return (
      <div className="anim-slide max-w-2xl mx-auto px-5 pt-10 pb-16">
        <PageHeader setView={setView} eyebrow="Quiz · Result" title="Multiple choice done" />
        <div className="rounded-3xl p-8 text-center border relative overflow-hidden mb-4" style={{ background: COLORS.paper, borderColor: COLORS.line }}>
          <div className="absolute -top-8 -right-8 w-32 h-32 rounded-full opacity-15" style={{ background: COLORS.gold }} />
          <div className="relative">
            <Trophy size={32} className="mx-auto mb-4" style={{ color: COLORS.gold }} />
            <div className="font-display text-7xl mb-2" style={{ fontWeight: 600 }}>
              {score}<span style={{ color: COLORS.muted }}>/{questions.length}</span>
            </div>
            <div className="text-base" style={{ color: COLORS.muted }}>{msg}</div>
          </div>
        </div>

        {/* Spelling invitation */}
        <div className="rounded-2xl p-5 border mb-4" style={{ background: COLORS.paper, borderColor: COLORS.line }}>
          <div className="flex items-center gap-2 mb-2">
            <Brain size={18} style={{ color: COLORS.red }} />
            <span className="font-display text-xl" style={{ fontWeight: 600 }}>Now try spelling</span>
          </div>
          <p className="text-sm leading-relaxed mb-4" style={{ color: COLORS.muted }}>
            Type the German words yourself — this is where the learning really sticks. The words you missed just now come first.
          </p>
          <button
            onClick={startSpelling}
            className="w-full rounded-xl py-3.5 text-sm font-medium transition active:scale-95"
            style={{ background: COLORS.red, color: COLORS.paper }}
          >
            Start spelling round →
          </button>
        </div>

        <div className="flex gap-3">
          <button onClick={() => setView('home')} className="flex-1 rounded-xl py-3 px-5 border text-sm font-medium" style={{ borderColor: COLORS.line }}>
            Home
          </button>
          <button onClick={restartAll} className="flex-1 rounded-xl py-3 px-5 border text-sm font-medium" style={{ borderColor: COLORS.line }}>
            New quiz
          </button>
        </div>
      </div>
    );
  }

  // ============ SPELLING ROUND ============
  if (phase === 'spelling') {
    const word = spellWords[spellIndex];
    const firstLetter = stripArticle(word.de).charAt(0);
    return (
      <div className="anim-slide max-w-2xl mx-auto px-5 pt-10 pb-16">
        <PageHeader setView={setView} eyebrow={`Spelling · ${spellIndex + 1} of ${spellWords.length}`} title="Type it in German" />

        <div className="flex items-center gap-3 mb-5 text-sm" style={{ color: COLORS.muted }}>
          <span>Score: <span style={{ color: COLORS.ink, fontWeight: 600 }}>{spellScore}</span></span>
          <div className="flex-1 h-[2px]" style={{ background: COLORS.line }}>
            <div className="h-full transition-all" style={{ width: `${(spellIndex / spellWords.length) * 100}%`, background: COLORS.red }} />
          </div>
        </div>

        <div className="rounded-3xl p-8 mb-5 border text-center" style={{ background: COLORS.paper, borderColor: COLORS.line }}>
          <div className="text-xs tracking-wider uppercase mb-2" style={{ color: COLORS.muted }}>English</div>
          <div className="font-display text-4xl leading-tight mb-3" style={{ fontWeight: 500 }}>{word.en}</div>
          <div className="text-xs" style={{ color: COLORS.muted }}>
            {word.cat} · starts with &ldquo;{firstLetter}&rdquo;
          </div>
        </div>

        <input
          value={spellInput}
          onChange={(e) => setSpellInput(e.target.value)}
          onKeyDown={(e) => { if (e.key === 'Enter') { spellResult ? nextSpelling() : submitSpelling(); } }}
          disabled={!!spellResult}
          autoFocus
          autoCapitalize="off"
          autoCorrect="off"
          autoComplete="off"
          spellCheck={false}
          placeholder="Type the German word…"
          className="w-full rounded-xl px-4 py-4 border text-lg font-display mb-2 outline-none"
          style={{
            background: COLORS.paper,
            borderColor: spellResult === 'correct' ? COLORS.forest : spellResult === 'wrong' ? COLORS.red : COLORS.line,
            color: COLORS.ink,
          }}
        />
        <div className="text-xs mb-4" style={{ color: COLORS.muted }}>
          No umlaut keys? Type <strong style={{ color: COLORS.ink }}>ae, oe, ue, ss</strong> for ä, ö, ü, ß.
        </div>

        {spellResult && (
          <div
            className="rounded-xl p-4 mb-4 anim-slide"
            style={{ background: spellResult === 'correct' ? COLORS.forest : COLORS.red, color: COLORS.paper }}
          >
            <div className="flex items-center gap-2 mb-1">
              {spellResult === 'correct' ? <Check size={18} /> : <X size={18} />}
              <span className="font-medium">{spellResult === 'correct' ? 'Correct!' : 'Not quite'}</span>
            </div>
            <div className="text-sm opacity-95">
              The answer is <strong>{word.de}</strong> — {word.en}.
            </div>
          </div>
        )}

        {!spellResult ? (
          <button
            onClick={submitSpelling}
            className="w-full rounded-xl py-4 text-sm font-medium transition active:scale-95"
            style={{ background: COLORS.ink, color: COLORS.paper }}
          >
            Check
          </button>
        ) : (
          <button
            onClick={nextSpelling}
            className="w-full rounded-xl py-4 text-sm font-medium transition active:scale-95"
            style={{ background: COLORS.red, color: COLORS.paper }}
          >
            {spellIndex + 1 >= spellWords.length ? 'See result' : 'Next word'} →
          </button>
        )}
      </div>
    );
  }

  // ============ SPELLING RESULT ============
  if (phase === 'spellingResult') {
    const pct = Math.round((spellScore / spellWords.length) * 100);
    const msg = pct >= 80 ? 'Excellent spelling!' : pct >= 50 ? 'Solid effort — review the tricky ones.' : 'Spelling takes time. The missed words are saved for review.';
    return (
      <div className="anim-slide max-w-2xl mx-auto px-5 pt-10 pb-16">
        <PageHeader setView={setView} eyebrow="Spelling · Result" title="How you spelled" />
        <div className="rounded-3xl p-8 text-center border relative overflow-hidden mb-4" style={{ background: COLORS.paper, borderColor: COLORS.line }}>
          <div className="absolute -top-8 -left-8 w-32 h-32 rounded-full opacity-15" style={{ background: COLORS.red }} />
          <div className="relative">
            <Sparkles size={32} className="mx-auto mb-4" style={{ color: COLORS.gold }} />
            <div className="font-display text-7xl mb-2" style={{ fontWeight: 600 }}>
              {spellScore}<span style={{ color: COLORS.muted }}>/{spellWords.length}</span>
            </div>
            <div className="text-base" style={{ color: COLORS.muted }}>{msg}</div>
          </div>
        </div>
        <div className="flex gap-3">
          <button onClick={() => setView('home')} className="flex-1 rounded-xl py-3 px-5 border text-sm font-medium" style={{ borderColor: COLORS.line }}>
            Home
          </button>
          <button onClick={restartAll} className="flex-1 rounded-xl py-3 px-5 text-sm font-medium" style={{ background: COLORS.red, color: COLORS.paper }}>
            New quiz
          </button>
        </div>
        <p className="text-xs text-center mt-5" style={{ color: COLORS.muted }}>
          Words you missed are added to your review queue and will reappear in flashcards and future quizzes.
        </p>
      </div>
    );
  }

  // ============ MULTIPLE CHOICE ============
  return (
    <div className="anim-slide max-w-2xl mx-auto px-5 pt-10 pb-16">
      <PageHeader setView={setView} eyebrow={`Quiz · ${current + 1} of ${questions.length}`} title="What does this mean?" />

      <div className="flex items-center gap-3 mb-6 text-sm" style={{ color: COLORS.muted }}>
        <span>Score: <span style={{ color: COLORS.ink, fontWeight: 600 }}>{score}</span></span>
        <div className="flex-1 h-[2px]" style={{ background: COLORS.line }}>
          <div className="h-full transition-all" style={{ width: `${(current / questions.length) * 100}%`, background: COLORS.red }} />
        </div>
      </div>

      <div className="rounded-3xl p-8 mb-6 border text-center" style={{ background: COLORS.paper, borderColor: COLORS.line }}>
        <div className="text-xs tracking-wider uppercase mb-2" style={{ color: COLORS.muted }}>German</div>
        <div className="font-display text-5xl leading-tight" style={{ fontWeight: 500 }}>{q.prompt}</div>
        {hasVoice && (
          <button
            onClick={() => speakWord(q.prompt)}
            className="mt-4 inline-flex items-center gap-2 px-4 py-2 rounded-full border transition active:scale-95"
            style={{ borderColor: COLORS.line, background: COLORS.bg }}
          >
            <Volume2 size={15} style={{ color: COLORS.red }} />
            <span className="text-xs tracking-wider uppercase font-medium" style={{ color: COLORS.ink }}>Hear it</span>
          </button>
        )}
      </div>

      <div className="space-y-3">
        {q.options.map(opt => {
          const isSelected = selected === opt;
          const isCorrect = selected && opt === q.answer;
          const isWrong = isSelected && opt !== q.answer;
          return (
            <button
              key={opt}
              onClick={() => choose(opt)}
              disabled={!!selected}
              className="w-full rounded-xl p-4 text-left border transition flex items-center justify-between font-medium"
              style={{
                background: isCorrect ? COLORS.forest : isWrong ? COLORS.red : COLORS.paper,
                color: (isCorrect || isWrong) ? COLORS.paper : COLORS.ink,
                borderColor: isCorrect ? COLORS.forest : isWrong ? COLORS.red : COLORS.line,
              }}
            >
              <span>{opt}</span>
              {isCorrect && <Check size={18} />}
              {isWrong && <X size={18} />}
            </button>
          );
        })}
      </div>
    </div>
  );
}


// ---- Mount ----
ReactDOM.createRoot(document.getElementById('root')).render(<App />);

</script>
</body>
</html>
