<style>html,body{margin:0;padding:0;background:#F2ECDF;}#root{min-height:100vh;}
#boot{font-family:Georgia,serif;text-align:center;padding:40vh 24px 0;color:#7A6F5C;}</style>
<script>

  // window.storage: same async API as the Claude artifact version, stored in this
  // phone's localStorage. Data stays on the device and survives every app update.
  window.storage = {
    async get(key, shared) {
      const v = localStorage.getItem('gapp_' + key);
      return v === null ? null : { key, value: v, shared: !!shared };
    },
    async set(key, value, shared) {
      localStorage.setItem('gapp_' + key, value);
      return { key, value, shared: !!shared };
    },
    async delete(key) { localStorage.removeItem('gapp_' + key); return { key, deleted: true }; },
    async list(prefix, shared) {
      const keys = [];
      for (let i = 0; i < localStorage.length; i++) {
        const k = localStorage.key(i);
        if (k && k.startsWith('gapp_') && (!prefix || k.slice(5).startsWith(prefix))) keys.push(k.slice(5));
      }
      return { keys, prefix: prefix || null, shared: !!shared };
    },
  };
  // Ask Safari to keep this site's storage (not evicted under storage pressure)
  try { navigator.storage && navigator.storage.persist && navigator.storage.persist(); } catch (e) {}
  window.addEventListener('error', function (e) {
    var b = document.getElementById('boot');
    if (b) b.textContent = 'Could not start the app. Check your connection and reload. (' + (e.message || 'error') + ')';
  });

</script>
